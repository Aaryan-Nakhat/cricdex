[project]
name = "cricdex"
version = "0.0.1"
description = "Open cricket intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aaryan Nakhat" }]
dependencies = [
    # Core data
    "duckdb>=1.1.0",
    "pyarrow>=18.0.0",
    "polars>=1.20.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "pyyaml>=6.0",
    # HTTP / scraping
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "playwright>=1.49.0",
    "tenacity>=9.0.0",
    # PDF (rules module)
    "pdfplumber>=0.11.0",
    # NLP / ML
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.0",
    "sentence-transformers>=3.3.0",
    "rapidfuzz>=3.10.0",
    "rank-bm25>=0.2.2",
    # LLM / RAG
    "google-genai>=0.7.0",
    "qdrant-client>=1.12.0",
    # Modeling
    "pymc>=5.18.0",
    "arviz>=0.20.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Storage
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    # Utils
    "loguru>=0.7.0",
    "tqdm>=4.67.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
graph = ["neo4j>=5.27.0"]
ui = ["streamlit>=1.41.0", "plotly>=5.24.0", "altair>=5.5.0"]
bots = ["python-telegram-bot>=21.9.0", "praw>=7.8.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricdex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B"]
"scripts/*" = ["B008"]
"src/cricdex/**/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
