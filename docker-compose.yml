# CricDex local stack — anyone can `docker compose up -d` and have the
# full app + supporting services running. Heavier services (Postgres,
# Redis, Neo4j) are commented out — uncomment as those modules come online.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: cricdex-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cricdex:
    build:
      context: .
      dockerfile: Dockerfile
    image: cricdex:dev
    container_name: cricdex-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override .env values so the app reaches Qdrant by service name on
      # the compose network instead of trying to spin up its own embedded
      # local Qdrant inside the container.
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8080:8080"
    volumes:
      # Mount data dir so PDFs / Parquet / curated JSONL persist across
      # container restarts and stay editable from the host.
      - ./data:/app/data
      # Mount source for dev hot-reload. Comment out for a frozen image.
      - ./src:/app/src
      - ./scripts:/app/scripts

  # --- placeholders for future modules ---
