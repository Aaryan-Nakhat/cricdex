# CricDex local stack — `docker compose up -d` runs the app; add
# `--profile dashboard` for the Streamlit UI. CricDex is data-file driven
# (DuckDB + exported JSON) — no vector DB or graph DB needed.

services:
  cricdex:
    build:
      context: .
      dockerfile: Dockerfile
    image: cricdex:dev
    container_name: cricdex-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Mount data dir so Parquet / DuckDB / curated JSON persist across
      # container restarts and stay editable from the host.
      - ./data:/app/data
      # Mount source for dev hot-reload. Comment out for a frozen image.
      - ./src:/app/src
      - ./scripts:/app/scripts

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: cricdex:dev
    container_name: cricdex-dashboard
    restart: unless-stopped
    profiles: ["dashboard"]
    env_file:
      - .env
    ports:
      - "8511:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    command: >
      uv run streamlit run src/cricdex/dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
      --browser.gatherUsageStats false
