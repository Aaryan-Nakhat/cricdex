# CricDex local stack — `docker compose up -d` runs the app; add
# `--profile dashboard` for the Streamlit UI. CricDex is data-file driven
# (DuckDB + exported JSON) — no vector DB or graph DB needed.
#
# Both services run as the unprivileged `app` user (uid 1000) and publish their ports on
# 127.0.0.1 only, so nothing is reachable from your network by default. To expose them on
# purpose (a LAN box, a reverse proxy in another container), set CRICDEX_BIND in .env or the
# shell, e.g. `CRICDEX_BIND=0.0.0.0 docker compose up -d`. The API has no login, so put it
# behind a proxy with auth before you do that on an untrusted network.
# On a Linux host whose user is not uid 1000, add `user: "<uid>:<gid>"` to a service so the
# bind-mounted data/ stays writable.

services:
  cricdex:
    build:
      context: .
      dockerfile: Dockerfile
    image: cricdex:dev
    container_name: cricdex-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${CRICDEX_BIND:-127.0.0.1}:8080:8080"
    volumes:
      # Mount data dir so Parquet / DuckDB / curated JSON persist across
      # container restarts and stay editable from the host.
      - ./data:/app/data
      - ./site/public/data:/app/site/public/data
      # Mount source for dev hot-reload. Comment out for a frozen image.
      - ./src:/app/src
      - ./scripts:/app/scripts
      # the league registry: add a league on the host, the container sees it
      - ./config:/app/config

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: cricdex:dev
    container_name: cricdex-dashboard
    restart: unless-stopped
    profiles: ["dashboard"]
    env_file:
      - path: .env
        required: false
    ports:
      - "${CRICDEX_BIND:-127.0.0.1}:8511:8501"
    volumes:
      - ./data:/app/data
      - ./site/public/data:/app/site/public/data
      - ./src:/app/src
      - ./config:/app/config
    command: >
      uv run --frozen streamlit run src/cricdex/dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
      --browser.gatherUsageStats false
