<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy (GitHub Pages can't send headers). The build swaps the placeholder
         for the hashes of the inline scripts below (vite.config.ts); dev mode drops this tag.
         Images: player photos are Wikimedia Commons links, which redirect to its image hosts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'csp-inline-script-hashes'; style-src 'self'; img-src 'self' https://*.wikimedia.org; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <link rel="icon" type="image/svg+xml" href="/cricdesk/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CricDesk — open cricket intelligence from Cricsheet ball-by-ball data: win-probability impact (NGI) and twelve more context metrics, Bayesian opponent-adjusted ratings, cross-league scouting and a real-rules IPL auction."
    />
    <meta name="author" content="Aaryan Nakhat" />
    <meta name="theme-color" content="#060a0f" />
    <link rel="canonical" href="https://aaryan-nakhat.github.io/cricdesk/" />
    <!-- Link previews (Open Graph, Twitter / X card). The image is docs/media/src/og.html rendered by
         scripts/render_images.py og to site/public/og.png (1200 x 630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CricDesk" />
    <meta property="og:title" content="CricDesk: the numbers behind cricket, honestly modelled" />
    <meta
      property="og:description"
      content="IPL 2027 retention calls for all ten teams, a real-rules auction room, Bayesian ratings and cross-league scouting, from Cricsheet ball-by-ball data. By Aaryan Nakhat."
    />
    <meta property="og:url" content="https://aaryan-nakhat.github.io/cricdesk/" />
    <meta property="og:image" content="https://aaryan-nakhat.github.io/cricdesk/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CricDesk: the numbers behind cricket, honestly modelled. By Aaryan Nakhat." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CricDesk: the numbers behind cricket, honestly modelled" />
    <meta
      name="twitter:description"
      content="IPL 2027 retention calls for all ten teams, a real-rules auction room, Bayesian ratings and cross-league scouting, from Cricsheet ball-by-ball data. By Aaryan Nakhat."
    />
    <meta name="twitter:image" content="https://aaryan-nakhat.github.io/cricdesk/og.png" />
    <meta name="twitter:image:alt" content="CricDesk: the numbers behind cricket, honestly modelled. By Aaryan Nakhat." />
    <link rel="preload" href="/cricdesk/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Theme before first paint (no flash): saved choice, else the system's.
      (function () {
        try {
          var t = localStorage.getItem("cricdesk.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <title>CricDesk — open cricket intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
