<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cricdex/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CricDex — open cricket intelligence from Cricsheet ball-by-ball data: win-probability impact (NGI) and ten more context metrics, Bayesian opponent-adjusted ratings, cross-league scouting and a real-rules IPL auction."
    />
    <meta name="theme-color" content="#060a0f" />
    <link rel="preload" href="/cricdex/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Theme before first paint (no flash): saved choice, else the system's.
      (function () {
        try {
          var t = localStorage.getItem("cricdex.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <title>CricDex — open cricket intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
