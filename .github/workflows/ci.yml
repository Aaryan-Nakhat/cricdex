name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # the refresh workflow runs CI on its data commit before deploying it
  workflow_call:
    inputs:
      ref:
        description: "Commit to test"
        required: false
        type: string

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      # `ui` brings Streamlit for the dashboard tests
      - run: uv sync --frozen --group dev --extra ui
      # the web/Python parity tests (test_scripts/) run the site's TypeScript through Node
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest
      - name: Type-check the website
        run: ./node_modules/.bin/tsc --noEmit -p .
        working-directory: site
