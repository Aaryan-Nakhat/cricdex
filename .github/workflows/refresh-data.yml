name: refresh-data

# The "refresh to today" backend. GitHub Pages can't recompute in the
# browser (no JAX / XGBoost / Neo4j in WASM), so this Action is the
# compute layer: it re-ingests Cricsheet, recomputes the metrics +
# dismissal-aware Bayesian ratings, repopulates the scout graph, re-cooks
# the static JSON snapshot, and commits it. That commit touches
# site/public/data/** which triggers deploy-pages, so the live site moves
# to the latest match date.
#
# MANUAL ONLY — runs when you click "Run workflow" in the Actions tab (no
# nightly cron, so the 35 MB snapshot isn't re-committed automatically and
# git history stays lean). This is the heavy path (ingest + 5× ADVI fits +
# Neo4j): best-effort per collection — a collection that fails to ingest is
# skipped, the rest still refresh. If nothing changed, no commit/deploy.

on:
  workflow_dispatch:
    inputs:
      collections:
        description: "Space-separated collections (blank = all)"
        required: false
        default: ""

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write # commit the re-cooked snapshot back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/cricdex_dev
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cricdex_dev
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync

      - name: Pick collections
        id: cols
        run: |
          INPUT="${{ github.event.inputs.collections }}"
          if [ -z "$INPUT" ]; then
            INPUT="ipl bbl t20s_male indian_domestic_male recently_played_30_male"
          fi
          echo "list=$INPUT" >> "$GITHUB_OUTPUT"
          echo "Refreshing: $INPUT"

      - name: Ingest people register
        run: uv run python scripts/ingest_people.py || echo "people ingest failed (non-fatal)"

      - name: Bootstrap scout graph
        run: uv run python scripts/scout_graph.py bootstrap || echo "graph bootstrap failed (non-fatal)"

      - name: Ingest + compute per collection
        run: |
          set +e
          for C in ${{ steps.cols.outputs.list }}; do
            echo "::group::$C"
            if [ "$C" = "indian_domestic_male" ]; then
              uv run python scripts/ingest_cricsheet.py indian-domestic
            else
              uv run python scripts/ingest_cricsheet.py ingest --collection "$C"
            fi
            uv run python scripts/compute_metrics.py all --collection "$C"
            uv run python scripts/scout_graph.py populate --collection "$C"
            uv run python scripts/scout_rate.py --collection "$C" --advi-steps 12000
            echo "::endgroup::"
          done

      - name: Enrich new players (taxonomy) — only if key is configured
        env:
          # `secrets` can't be used in `if:` — gate inside the step instead.
          GEMINI_KONG_KEY: ${{ secrets.GEMINI_KONG_KEY }}
        run: |
          if [ -z "$GEMINI_KONG_KEY" ]; then
            echo "GEMINI_KONG_KEY not set — skipping taxonomy enrich"
            exit 0
          fi
          uv run python scripts/enrich_taxonomy.py --batch 20 || echo "taxonomy enrich failed (non-fatal)"

      - name: Cook the static snapshot
        run: uv run python scripts/export_site.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "cricdex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data
          if git diff --cached --quiet; then
            echo "No data changes — nothing to deploy."
          else
            STAMP=$(date -u +%Y-%m-%d)
            git commit -m "data: nightly refresh ($STAMP)"
            git push
          fi
