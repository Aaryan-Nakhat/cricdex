name: refresh-data

# The "refresh to today" backend. GitHub Pages can't recompute in the
# browser (no JAX / XGBoost in WASM), so this Action is the compute layer:
# it runs the default steps of the rebuild pipeline (src/cricdex/pipeline.py,
# docs/PIPELINE.md: re-download Cricsheet, People Register, player master,
# dismissal-aware Bayesian ratings, metrics, form forecast, the static JSON
# snapshot), commits the snapshot, runs CI on that commit and, once CI
# passes, the Pages deploy, so the live site moves to the latest match date.
#
# MANUAL ONLY — runs when you click "Run workflow" in the Actions tab (no
# nightly cron, so the snapshot isn't re-committed automatically and git
# history stays lean). The first failing step stops the run, so a half-
# refreshed snapshot is never committed. The model fits (refit steps) never
# run here. If nothing changed, no commit and no deploy.

on:
  workflow_dispatch:
    inputs:
      collections:
        description: "Space-separated collections (blank = all)"
        required: false
        default: ""

concurrency:
  group: refresh-data
  cancel-in-progress: false

# Read-only by default; the refresh job alone may write (it commits the re-cooked snapshot).
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # every league's ingest + ratings, and the forecast's walk-forward fits from an empty cache
    timeout-minutes: 300
    permissions:
      contents: write # commit the re-cooked snapshot back to main
    env:
      # every `uv run` installs exactly what uv.lock pins (fails if the lock is stale)
      UV_LOCKED: "1"
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # No token left in .git/config: the ingest, model and LLM steps never see a push credential.
      # The commit step passes it to `git push` itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --locked

      # The input is passed through env (never pasted into the script) and every word must be a
      # league key from config/leagues.toml, so it can't inject shell or a stray path.
      - name: Pick collections
        id: cols
        env:
          INPUT: ${{ inputs.collections }}
        run: |
          set -euo pipefail
          set -f # no glob expansion of the input words
          KNOWN=" $(uv run python -m cricdex.leagues list --sep ' ') "
          if [ -z "${INPUT//[[:space:]]/}" ]; then
            # every league marked `export = true` in config/leagues.toml
            INPUT="$(uv run python -m cricdex.leagues list --exported --sep ' ')"
          fi
          LIST=""
          for C in $INPUT; do
            if ! [[ "$C" =~ ^[a-z0-9_]{1,40}$ ]] || [[ "$KNOWN" != *" $C "* ]]; then
              echo "::error::Unknown collection: not a league key in config/leagues.toml"
              exit 1
            fi
            LIST="$LIST $C"
          done
          LIST="${LIST# }"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Refreshing: $LIST"

      # Ingest, People Register, player master (Wikidata, Wikipedia, Cricsheet internationals; the
      # LLM name check runs only when an LLM is configured), ratings, metrics, form forecast, export.
      # Output streams to the job log (CRICDEX_REBUILD_LOG=-).
      - name: Rebuild (python -m cricdex.pipeline)
        env:
          LEAGUES: ${{ steps.cols.outputs.list }}
          CRICDEX_REBUILD_LOG: "-"
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: uv run python -m cricdex.pipeline --fresh

      # The taxonomy reads the players from the snapshot, so it runs after a first cook and the snapshot is
      # cooked again — new players get their role / country in this same refresh.
      - name: Enrich new players (taxonomy) — only if an LLM is configured
        id: tax
        env:
          # `secrets` can't be used in `if:` — gate inside the step instead.
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: |
          if [ -z "$LLM_MODEL" ]; then
            echo "LLM_MODEL not set — skipping taxonomy enrich"
            exit 0
          fi
          uv run python scripts/enrich_taxonomy.py --batch 20 && echo "ran=1" >> "$GITHUB_OUTPUT" \
            || echo "taxonomy enrich failed (non-fatal)"

      - name: Re-cook the snapshot with the new players' taxonomy
        if: steps.tax.outputs.ran == '1'
        env:
          CRICDEX_REBUILD_LOG: "-"
        run: uv run python -m cricdex.pipeline --only export

      - name: Commit refreshed snapshot
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "cricdex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data
          if git diff --cached --quiet; then
            echo "No data changes — nothing to deploy."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(date -u +%Y-%m-%d)
            git commit -m "data: refresh ($STAMP)"
            # the token is used for this one push only (checkout kept no credential)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"               push origin "HEAD:$GITHUB_REF_NAME"
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # A push made with the workflow's own token doesn't start other workflows, so CI and the deploy
  # are called directly, both on the refreshed commit; the deploy runs only once CI passes.
  ci:
    needs: refresh
    if: needs.refresh.outputs.changed == '1'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

  deploy:
    needs: [refresh, ci]
    if: needs.refresh.outputs.changed == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
