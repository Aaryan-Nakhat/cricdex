name: refresh-data

# The "refresh to today" backend. GitHub Pages can't recompute in the
# browser (no JAX / XGBoost in WASM), so this Action is the compute layer:
# it re-downloads Cricsheet, recomputes the metrics + dismissal-aware
# Bayesian ratings, re-cooks the static JSON snapshot, commits it, and then
# runs the Pages deploy so the live site moves to the latest match date.
#
# MANUAL ONLY — runs when you click "Run workflow" in the Actions tab (no
# nightly cron, so the snapshot isn't re-committed automatically and git
# history stays lean). Best-effort per collection: a collection that fails
# to ingest is skipped, the rest still refresh. If nothing changed, no
# commit and no deploy.

on:
  workflow_dispatch:
    inputs:
      collections:
        description: "Space-separated collections (blank = all)"
        required: false
        default: ""

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write # commit the re-cooked snapshot back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync

      - name: Pick collections
        id: cols
        run: |
          INPUT="${{ github.event.inputs.collections }}"
          if [ -z "$INPUT" ]; then
            INPUT="ipl bbl t20s_male indian_domestic_male recently_played_30_male sa20 cpl blast"
          fi
          echo "list=$INPUT" >> "$GITHUB_OUTPUT"
          echo "Refreshing: $INPUT"

      - name: Ingest people register
        run: uv run python scripts/ingest_people.py || echo "people ingest failed (non-fatal)"

      - name: Ingest + compute per collection
        run: |
          set +e
          for C in ${{ steps.cols.outputs.list }}; do
            echo "::group::$C"
            # --force: always re-download, so a cached zip can't pin the data to an old date.
            if [ "$C" = "indian_domestic_male" ]; then
              uv run python scripts/ingest_cricsheet.py indian-domestic --force
            else
              uv run python scripts/ingest_cricsheet.py ingest --collection "$C" --force
            fi
            # Ratings first: the Wicket Quality metric reads the fitted scout ratings.
            uv run python scripts/scout_rate.py --collection "$C" --advi-steps 12000
            uv run python scripts/compute_metrics.py all --collection "$C"
            echo "::endgroup::"
          done

      - name: Cook the static snapshot
        run: uv run python scripts/export_site.py

      # The taxonomy reads the players from the snapshot, so it runs after a first cook and the snapshot is
      # cooked again — new players get their role / country in this same refresh.
      - name: Enrich new players (taxonomy) — only if an LLM is configured
        id: tax
        env:
          # `secrets` can't be used in `if:` — gate inside the step instead.
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: |
          if [ -z "$LLM_MODEL" ]; then
            echo "LLM_MODEL not set — skipping taxonomy enrich"
            exit 0
          fi
          uv run python scripts/enrich_taxonomy.py --batch 20 && echo "ran=1" >> "$GITHUB_OUTPUT" \
            || echo "taxonomy enrich failed (non-fatal)"

      - name: Re-cook the snapshot with the new players' taxonomy
        if: steps.tax.outputs.ran == '1'
        run: uv run python scripts/export_site.py

      - name: Commit refreshed snapshot
        id: commit
        run: |
          git config user.name  "cricdex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data
          if git diff --cached --quiet; then
            echo "No data changes — nothing to deploy."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(date -u +%Y-%m-%d)
            git commit -m "data: refresh ($STAMP)"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

  # A push made with the workflow's own token doesn't start other workflows, so the deploy is called directly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
