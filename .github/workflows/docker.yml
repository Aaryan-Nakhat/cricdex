name: docker

# Proves the image still builds (and the API imports inside it) whenever
# something that goes into the image changes. Build only — nothing is pushed.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - README.md
      - src/**
      - scripts/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: cricdex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (API imports, CLI runs)
        run: |
          docker run --rm cricdex:ci uv run --frozen python -c "import cricdex.api.main; print('api import ok')"
          docker run --rm cricdex:ci uv run --frozen cricdex --help
      - name: Compose file is valid
        run: docker compose config --quiet
