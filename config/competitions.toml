# CricDex competition rules: one entry per auction / retention cycle of a franchise league.
#
# A cycle's rules are data, not code: the "Keep or release" calculator (`cricdex keep`, the
# website's Keep or release page) reads its purse, squad limits, overseas cap and retention rules
# from here, so another league's cycle (SA20, ILT20, MLC, WPL ...) is one more `[[competition]]`
# entry plus a squads file. Validated on load (`uv run python -m cricdex.competitions check`):
# known league key, sane limits, ISO dates, and every rule either backed by a source or listed in
# `assumed`, so a guess can never pass for a fact.
#
# Fields
#   key, name           id and display name
#   league              the collection key in config/leagues.toml whose values and prices are used
#   season, cycle       the season the squads are being built for; "mega" or "mini"
#   currency, unit      money is in `unit` of `currency` throughout (IPL: INR crore)
#   squads              the hand-editable squads + salaries file, relative to the data folder
#                       (`data/` in the repo, or $CRICDEX_DATA_DIR)
#   retention_deadline  ISO dates; `auction_venue` free text
#   auction_date
#   purse               each team's auction purse for this cycle (before retentions)
#   squad_min/max       squad size limits after the auction
#   overseas_max        overseas players allowed in a squad
#   max_retained        most players a team may keep (0 = no limit)
#   max_overseas_retained   (0 = no limit beyond `overseas_max`)
#   rtm_cards           right-to-match cards at the auction (0 = none)
#   retained_cost       "salary": a kept player costs his current contract out of the purse
#                       "slabs": a player retained at the cycle's mega auction (`slab_holder` in the
#                       squads file) is charged by the retention slabs: the team's slab holders
#                       together cost the first n capped slabs + `uncapped_retention_slab` per
#                       uncapped one, or their salaries if those add up to more; everyone else
#                       costs his salary (web_parity/keep.py `slab_charge`)
#   retention_slabs     capped slabs in retention order (cr), only for "slabs"
#   uncapped_retention_slab   the uncapped slab (cr), only for "slabs"
#   replacements_retainable   may a season replacement signing be kept?
#   overseas_fee_cap    the most an overseas auction buy is paid (0 = no cap); the excess of his
#                       bid goes to the board, not the player (the franchise still pays the bid)
#   min_purse_spend_share   share of the purse a team must spend (0 = no rule)
#   assumed             the fields above that are NOT confirmed by a source (shown as assumptions)
#   [[competition.source]]  {about = field or "general", status = "official" | "reported",
#                            title, url, date (published, ISO; optional), note}

schema = 1

[[competition]]
key = "ipl_2027"
name = "IPL 2027 (mini auction)"
league = "ipl"
season = 2027
cycle = "mini"
currency = "INR"
unit = "cr"
squads = "curated/ipl_squads_2026.json"
retention_deadline = "2026-11-15"
auction_date = "2026-12-16"
auction_venue = "Goa, India"
# No 2027 purse has been published. 125 cr is the 2026 purse, kept until one is announced. (The
# 2025-27 regulations set the total salary cap at 146 / 151 / 157 cr for 2025 / 2026 / 2027 and the
# purse went 120 -> 125 cr, so ~131 cr is a plausible guess; nothing confirms it.)
# Checked again 2026-10-22 (issue I5): press reports of 18-19 Oct repeat the 157 cr salary cap and
# the 2026 figure of 125 cr; none gives a 2027 auction purse from the BCCI or the franchises (one
# site says 120, a preview guesses 130-140; neither cites anyone). So 125 stays, as an assumption.
purse = 125.0
squad_min = 18
squad_max = 25
overseas_max = 8
max_retained = 0
max_overseas_retained = 0
rtm_cards = 0
# The owner's call (2026-10-22): the 2025 mega-auction slabs keep counting until the BCCI publishes
# the 2027 rules ("assumed: 2025 mega-auction slabs until BCCI announces 2027 rules"). 2027 is the
# last mini auction of the 2025-27 cycle (press, Oct 2026), where a kept player stays on his
# contract; in the 2026 mini auction the purse still charged each 2025 retention at his slab (the
# published 2026 purses of all 10 teams are reproduced only that way), so the slabs are assumed to
# carry into 2027 for the players retained in 2025, and everyone else costs his salary.
retained_cost = "slabs"
retention_slabs = [18.0, 14.0, 11.0, 18.0, 14.0]
uncapped_retention_slab = 4.0
replacements_retainable = true
overseas_fee_cap = 18.0
min_purse_spend_share = 0.0
assumed = [
  "purse",
  "squad_min",
  "replacements_retainable",
  "min_purse_spend_share",
  "auction_date",
  "retained_cost",
]

