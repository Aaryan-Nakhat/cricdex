# CricDex league registry — the one list of every competition CricDex knows about.
#
# Adding a league is one `[[league]]` entry here plus `cricdex data ingest cricsheet -c <key>`
# (see docs/LEAGUES.md). Nothing else in the code names a league: ingest, the exporter, the
# website, the CLI/TUI, Streamlit, the API allow-list and the refresh workflow all read this file
# through `cricdex.leagues`.
#
# Read with the standard-library `tomllib`; validated on load (unique keys, known tiers, zip-name
# format, flag combinations). `uv run python -m cricdex.leagues check` validates it from the shell.

schema = 1

# ---------------------------------------------------------------------------------------------
# Strength tiers. `discount` is the value (population-sd units, see scout/ratings/bayesian.py)
# taken off a player's rating in that competition before it is compared with IPL value — the
# Auction pool and Scout prices both use it. `calibrated = false` marks a discount borrowed by
# analogy from a similar league and not yet checked against data (the site says so).
# `translation_sd` (optional) is how uncertain that translation is; the auction pool blends a
# player's leagues weighted by 1 / (rating sd² + translation_sd²), so IPL evidence dominates.
# Default: 0 for a zero-discount tier, 0.5 for a calibrated discount, 0.8 for a borrowed one.
# ---------------------------------------------------------------------------------------------

[tiers.ipl]
discount = 0.0
calibrated = true
note = "The reference competition: everything is priced in IPL value."

[tiers.smat]
discount = 1.28
calibrated = true
note = "Syed Mushtaq Ali: Indian domestic T20, far weaker attacks than the IPL."

[tiers.bbl]
discount = 0.45
calibrated = true
note = "Big Bash: strong overseas league."

[tiers.sa20]
discount = 0.45
calibrated = true
note = "SA20: strong overseas league, about BBL level."

[tiers.cpl]
discount = 0.64
calibrated = true
note = "CPL: slightly weaker than BBL / SA20."

[tiers.blast]
discount = 0.64
calibrated = true
note = "T20 Blast: English county T20, deep but uneven."

[tiers.psl]
discount = 0.45
calibrated = false
note = "Borrowed from BBL / SA20 (strong overseas league); not yet fitted."

[tiers.ilt20]
discount = 0.45
calibrated = false
note = "Borrowed from BBL / SA20 (strong overseas league); not yet fitted."

[tiers.hundred]
discount = 0.45
calibrated = false
note = "Borrowed from BBL / SA20 (strong overseas league); not yet fitted."

[tiers.mlc]
discount = 0.64
calibrated = false
note = "Borrowed from CPL / Blast; not yet fitted."

[tiers.bpl]
discount = 0.64
calibrated = false
note = "Borrowed from CPL / Blast; not yet fitted."

[tiers.lpl]
discount = 0.64
calibrated = false
note = "Borrowed from CPL / Blast; not yet fitted."

[tiers.super_smash]
discount = 0.64
calibrated = false
note = "Borrowed from CPL / Blast; not yet fitted."

[tiers.csa_t20]
discount = 0.64
calibrated = false
note = "Borrowed from CPL / Blast; not yet fitted."

# ---------------------------------------------------------------------------------------------
# Leagues. Fields:
#   key           collection id: table suffix (`balls_<key>`), site folder and URL `?c=` value
#   name / short  display label / abbreviation
#   zips          Cricsheet download file(s) under https://cricsheet.org/downloads/ (several are
#                 merged into one collection, de-duplicated by match id)
#   gender        male | female
#   kind          league | domestic | international | mixed
#   country       where it is played (a region for mixed / international)
#   tier          a [tiers.*] key (required for scout / auction pools)
#   export        cooked into the website / CLI / TUI / dashboard snapshot
#   active        still being played (inactive leagues stay readable)
#   order         display order (lower first)
#   scout_pool    a Scout look-alike panel; its key in scout_index.json is the tier key
#     scout_group   peers (profile-linkable) | uncapped | overseas
#     draftable     its players can be drafted into the Auction room
#     gem_pool      the uncapped-gem (moneyball) board is drawn from this pool
#   auction_pool  feeds the cross-league auction pool
#   [[league.era]]  optional, repeatable: key (lowercase letters / digits), name, since (ISO
#                 date). Each era is exported as a recomputed leaderboard window `era_<key>`
#                 (matches on or after `since`), next to last1y / last3y.
#   auction_target  the competition the auction pool is priced for (exactly one); its
#                   `auction_nationalities` (allow) and `auction_excluded_nationalities` (deny)
#                   lists say who may enter that pool as a free agent
# ---------------------------------------------------------------------------------------------

[[league]]
key = "ipl"
name = "IPL"
short = "IPL"
zips = ["ipl_json.zip"]
gender = "male"
kind = "league"
country = "India"
tier = "ipl"
export = true
active = true
order = 10
scout_pool = true
scout_group = "peers"
scout_title = "IPL peers"
scout_subtitle = "Most-similar active IPL players"
auction_pool = true
auction_target = true
# Who may enter this competition's auction pool as a free agent (a player already at a
# franchise always stays). `auction_nationalities` is the allow-list: nations whose players
# actually feature in an IPL auction; associate sides are left out because their value is
# inflated against minnows. `auction_excluded_nationalities` always wins over the allow-list:
# Pakistan (no IPL since 2008). Codes are compared after normalisation
# (cricdex.scout.identity.countries: RSA = ZAF, SRI = LKA, WI = WIN, IRE = IRL), so either
# spelling works here. An empty allow-list means "every nation except the excluded ones".
auction_nationalities = [
  "IND", "AUS", "ENG", "RSA", "ZAF", "NZL", "SRI", "LKA", "BAN", "AFG", "WIN", "WI", "IRE",
]
auction_excluded_nationalities = ["PAK"]

# Eras: a rule change that moved the scoring level. Each becomes its own recomputed window on the
# leaderboards (next to "last year" / "last 3 years"), so numbers from one era aren't ranked
# against another's. The Impact Player rule (a twelfth batter or bowler) started with the 2023 IPL.
[[league.era]]
key = "impact"
name = "Impact Player era"
since = "2023-03-31"

